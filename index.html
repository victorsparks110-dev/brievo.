<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BRIEVO — Design briefs and client–designer project collaboration."
    />
    <title>BRIEVO</title>
    <script>
      // Apply the user's saved theme before paint to avoid a flash of the
      // wrong theme. Default is the dark-blue theme; Light Mode opts in.
      ;(function () {
        try {
          if (window.localStorage.getItem('brievo-theme') === 'light') {
            document.documentElement.classList.add('light')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
